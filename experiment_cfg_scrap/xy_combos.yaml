defaults:
  - _self_

name: xy_combos
seed: 12345
n: 6

qubits:
  values: ["${n}"]
samples:
  powers: {base: 2, start: 7, stop: 17}
repetitions: 1

state:
  class: HRState
  name: HR_state

observables:
  init: random
  count: 50
  sample_indices: [X, Y]
  k_local: n
  padding_indices: [I]

# Null observable/sample batches select the original non-batched path.
batch:
  states: 1
  observables: null
  samples: null

experiments:
  - id: seeqst_xy
    shadow_class: SEEQSTShadow
    experiment_name: SEEQST
    path_prefix: results/SEEQSTXY
    verbose: true
  - id: pauli_xy
    shadow_class: PauliShadow
    experiment_name: Pauli
    path_prefix: results/PauliXY
    verbose: true
  - id: clifford_xy
    shadow_class: CliffordShadow
    experiment_name: Clifford
    path_prefix: results/CliffordXY
    verbose: true

plot:
  function: plot_avg_var
  path: results/scaling_n{n}_Nobs{N_obs}_reps{reps}_N{Nmax}.pdf
  x: N
  xlog: false
  ylog: false
  metric: mae

hydra:
  run: {dir: .}
  output_subdir: null
  job: {chdir: false}
